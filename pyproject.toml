[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-context"
version = "0.1.0"
description = "把任意代码项目整理成一份 Markdown 上下文文档"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["context", "markdown", "llm", "code-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = [
    "pytest>=7",
    "pytest-qt>=4",
    "pytest-cov>=4",
    "pyinstaller>=6",
]

[project.scripts]
project-context = "project_context.cli:main"
project-context-gui = "project_context_gui.app:main"

[tool.setuptools]
packages = ["project_context", "project_context_gui"]
include-package-data = true

[tool.setuptools.package-data]
"project_context" = ["configs/**/*.toml"]
"project_context_gui" = ["resources/**/*"]